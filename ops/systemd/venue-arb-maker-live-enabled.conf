[Service]
# Two adverse maker fills are retained in the honest journal. Permit one final
# post-fix canary only after the shadow implementation closes profitably.
Environment=VENUE_ARB_LIVE_ENABLED=true
Environment=VENUE_ARB_LIVE_EXECUTION=maker-taker
Environment=VENUE_ARB_LIVE_NOTIONAL_USD=100
Environment=VENUE_ARB_LIVE_MAX_TRADES=3
Environment=VENUE_ARB_LIVE_REQUIRE_MAKER_SHADOW_PASSES=1
