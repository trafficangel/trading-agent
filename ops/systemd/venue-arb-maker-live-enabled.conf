[Service]
# Explicit one-trade real-money maker canary. Install only after a successful
# --sign-test and flat-account preflight; remove it to return to dry-run.
Environment=VENUE_ARB_LIVE_ENABLED=true
Environment=VENUE_ARB_LIVE_EXECUTION=maker-taker
Environment=VENUE_ARB_LIVE_NOTIONAL_USD=100
Environment=VENUE_ARB_LIVE_MAX_TRADES=1
