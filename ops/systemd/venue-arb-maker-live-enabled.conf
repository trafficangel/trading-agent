[Service]
# Two adverse maker fills are retained in the honest journal. The operator
# explicitly authorized one final post-fix real canary; the 15 bps entry,
# 12 bps cancel and 10 bps post-fill guards remain mandatory.
Environment=VENUE_ARB_LIVE_ENABLED=true
Environment=VENUE_ARB_LIVE_EXECUTION=maker-taker
Environment=VENUE_ARB_LIVE_NOTIONAL_USD=100
Environment=VENUE_ARB_LIVE_MAX_TRADES=3
Environment=VENUE_ARB_LIVE_REQUIRE_MAKER_SHADOW_PASSES=0
